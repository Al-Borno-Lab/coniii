[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "coniii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cython>=3.1.4",
    "ipython>=9.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "maturin>=1.9.6",
    "mpmath>=1.3.0",
    "multiprocess>=0.70.18",
    "numba>=0.62.1",
    "numpy>=2.3.4",
    "scipy>=1.16.2",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
target-dir = "build/rust"
# The .so file will be placed in the package directory for Python to find it
# This is the standard behavior for Python extensions
